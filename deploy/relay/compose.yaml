name: oct-relay-phase1

# LOCAL TEST ONLY.
#
# This compose file uses host networking and binds 127.0.0.1. Do not publish a
# port. A public relay requires `--allow-public`, a TLS/WSS terminator, E2EE on
# both endpoints, rate limits, and an independent security review.

services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    image: oct-relay:local
    restart: "no"
    init: true
    read_only: true
    network_mode: host
    command: ["relay", "--listen", "127.0.0.1:8080"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"
