apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oct-relay
  namespace: oct
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oct
      app.kubernetes.io/component: relay
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
