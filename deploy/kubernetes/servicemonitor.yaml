apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oct-relay
  namespace: oct
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [oct]
  selector:
    matchLabels:
      app.kubernetes.io/name: oct
      app.kubernetes.io/component: relay
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
