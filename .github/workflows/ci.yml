name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  check:
    name: clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked

  latest:
    name: latest Rust check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Keep the pinned 1.93.1 toolchain as the release baseline, but catch
      # breakage against the latest stable compiler early.
      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: latest-1.99

      - name: Check workspace on latest Rust
        run: cargo +1.99.0 check --workspace --all-targets --locked

  deny:
    name: dependency and license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  release-build:
    name: release build (${{ matrix.os }})
    needs: [fmt, check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Build release workspace
        run: cargo build --workspace --release --locked
