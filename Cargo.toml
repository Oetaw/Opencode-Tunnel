[workspace]
resolver = "2"
members = [
  "crates/oct-protocol",
  "crates/oct-transport",
  "crates/oct-security",
  "crates/oct-relay",
  "crates/oct-host",
  "crates/oct-client",
  "crates/oct-cli",
  "crates/oct-testkit",
  "crates/oct-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.93"
repository = "https://github.com/Oetaw/Opencode-Tunnel"
homepage = "https://github.com/Oetaw/Opencode-Tunnel"
documentation = "https://github.com/Oetaw/Opencode-Tunnel#readme"
description = "End-to-end encrypted tunnel for OpenCode"
keywords = ["opencode", "tunnel", "e2ee", "remote-access"]
categories = ["network-programming", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
blake2 = "0.11"
bytes = "1.10"
chacha20poly1305 = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = { version = "0.8", features = ["html_reports"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.13"
keyring = "4.2"
http = "1.2"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
rand = "0.10"
proptest = "1.6"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
